name: Firestore rules tests
on:
  push:
    branches: [security-stage2-rules-test]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - name: Run rules tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee out.txt
      - name: Report counts
        if: always()
        shell: bash
        run: |
          echo "::notice title=counts::$(grep -E '^. (tests|pass|fail) ' out.txt | tr '\n' ' ')"
          grep -E '^not ok|✖' out.txt | head -20 | while read -r l; do echo "::error title=failed::$l"; done || true
